<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NAVIQ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
  :root {
    --bg: #f4f5f2; --card: #ffffff; --ink: #14171a; --muted: #5d6670; --line: #d9ddd6;
    --accent: #1f6feb; --accent-soft: rgba(31, 111, 235, 0.18); --ok: #1a7f37; --warn: #9a6700;
    --edge: rgba(20, 23, 26, 0.35); --trail: #8250df;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --card: #161b22; --ink: #e6edf3; --muted: #8b949e; --line: #30363d;
      --accent: #58a6ff; --accent-soft: rgba(88, 166, 255, 0.22); --ok: #3fb950; --warn: #d29922;
      --edge: rgba(230, 237, 243, 0.4); --trail: #bc8cff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 14px 16px 32px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .status { margin: 12px 0; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .status b { font-size: 22px; display: block; }
  .status .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .status.ok b { color: var(--ok); }
  .status.stale b { color: var(--warn); }
  .map { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  #svg { display: block; width: 100%; height: auto; }
  .plan-img { opacity: 0.55; }
  @media (prefers-color-scheme: dark) { .plan-img { opacity: 0.35; filter: invert(1) hue-rotate(180deg); } }
  .edge { stroke: var(--edge); stroke-width: 3; stroke-linecap: round; }
  .node { fill: var(--muted); }
  .lbl { fill: var(--ink); font-size: 15px; font-weight: 600; paint-order: stroke; stroke: var(--card); stroke-width: 4px; }
  .trail { fill: none; stroke: var(--trail); stroke-width: 5; stroke-dasharray: 2 9; stroke-linecap: round; }
  .route { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; opacity: 0.6; }
  #me { transition: transform 0.6s ease; }
  .me-dot { fill: var(--accent); stroke: #fff; stroke-width: 4; }
  .me-halo { fill: var(--accent-soft); animation: pulse 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .cone { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
  @keyframes pulse { from { transform: scale(0.6); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
  .row { display: flex; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
  button { flex: 1 1 140px; min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-weight: 600; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .see { display: grid; grid-template-columns: 140px 1fr; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; align-items: start; }
  .see img { width: 140px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; background: var(--line); }
  .see h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 4px; }
  .chips span { display: inline-block; margin: 0 6px 6px 0; padding: 3px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); font-size: 13px; }
  .err { color: var(--warn); font-size: 13px; }
  #omap { height: 340px; border-radius: 12px; border: 1px solid var(--line); overflow: hidden; }
  .dial { display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: center; margin: 12px 0; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .dial svg { width: 120px; height: 120px; }
  .dial .ring { fill: none; stroke: var(--line); stroke-width: 3; }
  .dial .tick { fill: var(--muted); font-size: 13px; font-weight: 700; text-anchor: middle; }
  .dial .face { stroke: var(--accent); stroke-width: 6; stroke-linecap: round; }
  .dial .route { stroke: var(--ok); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 2 7; opacity: 1; fill: none; }
  .dial b { display: block; font-size: 18px; }
  .dial .k { color: var(--muted); font-size: 13px; }
  .dial .wrong { color: var(--warn); font-weight: 700; }
  .me-icon { width: 90px; height: 90px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; margin: 12px 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .tab { min-height: 42px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 600; }
  .tab.on { background: var(--accent); color: #fff; }
  .box { padding: 12px; border-radius: 14px; border: 2px solid var(--line); margin-bottom: 12px; background: var(--card); }
  .box.inside { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .box.outside { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
  .box .status, .box .map { background: var(--bg); }
  .boxh { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 10px; display: flex; justify-content: space-between; gap: 8px; }
  .navb small { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; opacity: .8; }
  .navb { margin: 0 0 12px; padding: 12px 14px; border-radius: 12px; background: var(--accent); color: #fff; }
  .navb b { display: block; font-size: 22px; letter-spacing: 0.02em; }
  .navb span { font-size: 15px; opacity: 0.92; }
  .search { display: flex; gap: 8px; margin: 12px 0 8px; }
  .search input { flex: 1; min-width: 0; min-height: 46px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 16px; }
  .search button { flex: 0 0 auto; padding: 0 18px; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .quick button { flex: 0 0 auto; min-height: 36px; padding: 0 12px; font-weight: 500; font-size: 14px; border-radius: 999px; }
  .results { display: grid; gap: 6px; margin: -4px 0 12px; }
  .results button { text-align: left; padding: 10px 12px; min-height: 0; font-weight: 500; }
  .results small { display: block; color: var(--muted); font-weight: 400; }
  .ghost { fill: none; stroke: var(--accent); stroke-width: 3; stroke-dasharray: 4 5; opacity: .7; }
  .cand { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 4; stroke-dasharray: 6 5; }
  .target-ring { fill: none; stroke: var(--ok); stroke-width: 6; }
  .target-lbl { fill: var(--ok); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--card); stroke-width: 4px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>NAVIQ</h1>
    <span class="sub" id="sens">Sensors off · tap any button</span>
  </header>

  <div class="navb" id="navb" hidden><small>Glasses say</small><b id="navi"></b><span id="navd"></span></div>

  <div class="tabs" role="tablist">
    <button type="button" id="tabIn" class="tab on" role="tab">Inside City Tech</button>
    <button type="button" id="tabOut" class="tab" role="tab">Outside</button>
  </div>

  <section class="box inside" id="boxIn">
    <h2 class="boxh">Inside City Tech <span class="sub" id="bldg"></span></h2>
    <div class="quick" id="quick"></div>
    <div class="status" id="status"><b id="where">Not tracking</b><div class="meta" id="meta">Pick a room, or “Where am I”, then look at a room number.</div></div>
    <div class="map" id="pmap"><svg id="svg" viewBox="0 0 100 40" aria-label="Floor plan with your position"></svg></div>
  </section>

  <section class="box outside" id="boxOut" hidden>
    <h2 class="boxh">Outside</h2>
    <form class="search" id="go" autocomplete="off">
      <input id="q" list="dests" placeholder="Address or place (Jay St MetroTech)" enterkeyhint="go">
      <datalist id="dests"></datalist>
      <button class="primary" type="submit">Go</button>
    </form>
    <div class="results" id="results"></div>
    <div class="status" id="ostatus"><b id="owhere">No outdoor trip</b><div class="meta" id="ometa">Search an address above.</div></div>
    <div id="omap"></div>
  </section>

  <div class="dial">
    <svg viewBox="-60 -60 120 120" aria-label="Which way you face vs the route">
      <circle class="ring" r="50"></circle>
      <text class="tick" y="-36">N</text><text class="tick" x="40" y="5">E</text><text class="tick" y="45">S</text><text class="tick" x="-40" y="5">W</text>
      <line id="dRoute" class="route" x1="0" y1="0" x2="0" y2="-46" style="display:none"></line>
      <line id="dFace" class="face" x1="0" y1="0" x2="0" y2="-42" style="display:none"></line>
      <circle r="5" fill="currentColor"></circle>
    </svg>
    <div>
      <b id="dTitle">Facing: —</b>
      <div class="k" id="dSrc">No compass reading yet</div>
      <div class="k" id="dRouteTxt"></div>
    </div>
  </div>

  <div class="row">
    <button id="stop">Stop trip</button>
    <button id="reset">Reset compass</button>
  </div>

  <div class="see">
    <img id="frame" alt="Latest glasses camera frame">
    <div>
      <h2>Glasses see</h2>
      <div class="chips" id="chips"><span>—</span></div>
      <div class="err" id="err"></div>
    </div>
  </div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const $ = (id) => document.getElementById(id);
let manualTab = 0, lastGps = null; // declared first: used by handlers that can run during page setup
const NS = "http://www.w3.org/2000/svg";
let plan = null, built = false, byId = {};
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

function bbox(nodes, pad) {
  const xs = nodes.map((n) => n.x), ys = nodes.map((n) => n.y);
  const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad;
  return [x0, y0, Math.max(...xs) + pad - x0, Math.max(...ys) + pad - y0];
}

const SIDE = /^(theater|gym)/; // theater/gym wing: only zoom out to it when they're over there
function build(floor, wide) {
  const svg = $("svg"); svg.innerHTML = "";
  const nodes = plan.nodes.filter((n) => n.floor === floor);
  svg.setAttribute("viewBox", bbox(wide ? nodes : nodes.filter((n) => !SIDE.test(n.id)), 60).join(" "));
  if (plan.image) el("image", { href: plan.image.url, x: 0, y: 0, width: plan.image.width, height: plan.image.height, class: "plan-img" }, svg);
  for (const [a, b] of plan.edges) {
    const A = byId[a], B = byId[b];
    if (A.floor === floor && B.floor === floor) el("line", { x1: A.x, y1: A.y, x2: B.x, y2: B.y, class: "edge" }, svg);
  }
  el("polyline", { id: "route", class: "route", points: "" }, svg);
  el("polyline", { id: "trail", class: "trail", points: "" }, svg);
  el("g", { id: "targets" }, svg);
  el("g", { id: "cands" }, svg);
  el("circle", { id: "ghost", r: 16, class: "ghost", style: "display:none" }, svg);
  const shown = new Set();
  for (const n of nodes) {
    if (n.kind === "corridor") continue;
    el("circle", { cx: n.x, cy: n.y, r: 5, class: "node" }, svg);
    const name = (n.label || "").replace(/^the /i, "");
    if (!name || shown.has(name + n.kind) || n.id === "lobby" || n.id === "double_doors") continue;
    shown.add(name + n.kind);
    const t = el("text", { x: n.x + 8, y: n.kind === "door" ? n.y + 22 : n.y - 9, class: "lbl" }, svg);
    t.textContent = name.length > 18 ? name.slice(0, 17) + "…" : name;
  }
  const me = el("g", { id: "me", style: "display:none" }, svg);
  el("path", { id: "cone", class: "cone", d: "M0 0 L-34 -90 A96 96 0 0 1 34 -90 Z", style: "display:none" }, me);
  el("circle", { r: 26, class: "me-halo" }, me);
  el("circle", { r: 11, class: "me-dot" }, me);
}

function render(p) {
  plan = p; byId = {}; for (const n of p.nodes) byId[n.id] = n;
  $("bldg").textContent = p.building;
  const trip = p.trip;
  const at = trip && trip.at ? byId[trip.at] : null;
  const floor = at ? at.floor : 1;
  const wide = Boolean(at && SIDE.test(at.id));
  if (built !== floor + (wide ? "w" : "")) { build(floor, wide); built = floor + (wide ? "w" : ""); }

  // Moving dot: the step estimate from the phone when they've walked since the last recognised place,
  // with a dashed ring left at that place.
  const me = $("me"), pos = trip && trip.est ? trip.est : at;
  if (pos) {
    me.style.display = "";
    me.setAttribute("transform", `translate(${pos.x} ${pos.y})`);
    me.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
  } else me.style.display = "none";
  const gh = $("ghost");
  if (at && trip.est) { gh.style.display = ""; gh.setAttribute("cx", at.x); gh.setAttribute("cy", at.y); } else gh.style.display = "none";

  const cone = $("cone");
  if (pos && p.heading) {
    const planAngle = p.heading.deg - (p.planUpBearing || 0); // degrees clockwise from "up" on the plan
    cone.style.display = "";
    cone.setAttribute("transform", `rotate(${planAngle})`);
  } else cone.style.display = "none";

  const pts = (ids) => (ids || []).map((id) => byId[id]).filter((n) => n && n.floor === floor).map((n) => `${n.x},${n.y}`).join(" ");
  $("trail").setAttribute("points", pts(trip ? trip.trailPath || trip.trail.map((t) => t.id) : []));
  $("route").setAttribute("points", trip && trip.kind !== "track" ? pts(trip.path) : "");

  // Placed at a room with two doors and can't yet tell which: show both, dashed.
  const cg = $("cands"); cg.innerHTML = "";
  const cands = !at && trip && trip.candidates ? trip.candidates.map((id) => byId[id]).filter((n) => n && n.floor === floor) : [];
  for (const n of cands) el("circle", { cx: n.x, cy: n.y, r: 16, class: "cand" }, cg);

  // Destination: green rings on its doors/spots.
  const tg = $("targets"); tg.innerHTML = "";
  if (trip && trip.kind !== "track") {
    let labelled = false;
    for (const id of trip.targetNodes || []) {
      const n = byId[id];
      if (!n || n.floor !== floor) continue;
      el("circle", { cx: n.x, cy: n.y, r: 18, class: "target-ring" }, tg);
      if (!labelled) { const t = el("text", { x: n.x + 22, y: n.y + 6, class: "target-lbl" }, tg); t.textContent = trip.target; labelled = true; }
    }
  }
  const nb = $("navb");
  if (p.nav && trip && trip.kind !== "track") { nb.hidden = false; $("navi").textContent = p.nav.instruction; $("navd").textContent = p.nav.detail || ""; }
  else nb.hidden = true;

  const st = $("status");
  if (!trip) {
    st.className = "status"; $("where").textContent = "Not tracking";
    $("meta").textContent = "Pick a room, or “Where am I”, then look at a room number.";
  } else if (trip.est && !at) {
    st.className = "status ok"; $("where").textContent = `Walking · ${trip.est.steps} steps`;
    $("meta").textContent = `from ${cands.length ? cands[0].label : "the last place seen"} · dot follows your steps until the next room number`;
  } else if (!at && cands.length) {
    st.className = "status stale"; $("where").textContent = `At ${cands[0].label} · one of ${cands.length} doors`;
    $("meta").textContent = "Look at the next room number or sign to pin down which door.";
  } else if (!at) {
    st.className = "status stale"; $("where").textContent = "Finding you…";
    $("meta").textContent = "Look at a room number (like A105) for a second.";
  } else {
    const name = (at.label || at.id).replace(/^the /i, "");
    const ago = trip.seenAgoMs == null ? null : Math.round(trip.seenAgoMs / 1000);
    st.className = "status " + (ago != null && ago <= 10 ? "ok" : "stale");
    $("where").textContent = (at.kind === "door" ? "At " : "Near ") + name;
    const bits = [];
    bits.push(ago == null ? "placed earlier" : ago <= 2 ? "seen just now" : `last seen ${ago}s ago`);
    if (p.heading) bits.push(`facing ${p.heading.deg}°${p.heading.calibrated ? "" : " (compass not calibrated yet)"}`);
    if (trip.est) bits.push(`${trip.est.steps} steps since${trip.strideLearned ? "" : " (stride not learned yet)"}`);
    if (trip.kind !== "track") bits.push(`to ${trip.target}`);
    $("meta").textContent = bits.join(" · ");
  }

  const r = p.read, chips = $("chips");
  chips.innerHTML = "";
  const items = r ? [...r.rooms.map((x) => `${x.label} · ${x.position}${x.close ? " · close" : ""}`), ...r.places.map((x) => `${x.kind.replace("_", " ")} · ${x.position}${x.close ? " · close" : ""}`), ...(r.signs || []).map((x) => `sign “${x.text.replace(/\s+/g, " ")}”${x.arrow && x.arrow !== "none" ? " " + x.arrow : ""}${x.close ? " · close" : ""}`)] : [];
  for (const t of items.length ? items : [r ? "nothing recognised" : "no recent frame"]) { const s = document.createElement("span"); s.textContent = t; chips.appendChild(s); }
}

// ---------- facing dial (indoor and outdoor): blue = way you face, green dashed = way to go ----------
const DIRS = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
const dirName = (d) => DIRS[Math.round(d / 45) % 8];
function dial(face, src, route) {
  const f = $("dFace"), r = $("dRoute");
  if (face != null) { f.style.display = ""; f.setAttribute("transform", `rotate(${face})`); $("dTitle").textContent = `Facing ${dirName(face)} · ${Math.round(face)}°`; $("dSrc").textContent = src || ""; }
  else { f.style.display = "none"; $("dTitle").textContent = "Facing: —"; $("dSrc").textContent = "No compass reading from the glasses yet"; }
  if (route != null) {
    r.style.display = ""; r.setAttribute("transform", `rotate(${route})`);
    let txt = `Route goes ${dirName(route)} · ${Math.round(route)}°`;
    if (face != null) {
      const rel = ((route - face + 540) % 360) - 180;
      const a = Math.abs(rel);
      txt += a < 40 ? " · you're facing it ✓" : a >= 130 ? " · turn around" : ` · turn ${rel > 0 ? "right" : "left"} ${Math.round(a)}°`;
      $("dRouteTxt").className = "k" + (a >= 60 ? " wrong" : "");
    }
    $("dRouteTxt").textContent = txt;
  } else { r.style.display = "none"; $("dRouteTxt").textContent = ""; }
}

// ---------- outdoor view: real map, route line, your GPS dot + facing cone ----------
let omap = null, oLine = null, oMe = null, oLineKey = "", oFollow = true;
function meIcon(face) {
  const cone = face == null ? "" : `<path d="M45 45 L28 6 A40 40 0 0 1 62 6 Z" fill="rgba(31,111,235,.25)" stroke="#1f6feb" stroke-width="1.5" transform="rotate(${face} 45 45)"/>`;
  return L.divIcon({ className: "", iconSize: [90, 90], iconAnchor: [45, 45], html: `<svg class="me-icon" viewBox="0 0 90 90">${cone}<circle cx="45" cy="45" r="9" fill="#1f6feb" stroke="#fff" stroke-width="3"/></svg>` });
}
function initOmap() {
  omap = L.map("omap", { zoomControl: false }).setView(lastGps ? [lastGps.lat, lastGps.lon] : [40.6955, -73.9867], 17);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(omap);
  omap.on("dragstart", () => { oFollow = false; });
}
function renderOutdoor(card, st) {
  if (!omap) initOmap();
  setTimeout(() => omap.invalidateSize(), 0);
  const line = (st.outdoor.line || []).map((p) => [p.lat, p.lon]);
  const key = line.length + ":" + (line[0] || "") + (line[line.length - 1] || "");
  if (key !== oLineKey) {
    if (oLine) oLine.remove();
    oLine = L.polyline(line, { color: "#1a7f37", weight: 6, opacity: 0.8 }).addTo(omap);
    if (line.length) omap.fitBounds(oLine.getBounds(), { padding: [30, 30] });
    oLineKey = key; oFollow = true;
  }
  const n = card.nav || {}, face = n.facing ? n.facing.deg : null;
  if (st.fix) {
    const ll = [st.fix.lat, st.fix.lon];
    if (!oMe) oMe = L.marker(ll, { icon: meIcon(face), interactive: false }).addTo(omap);
    else { oMe.setLatLng(ll); oMe.setIcon(meIcon(face)); }
    if (oFollow) omap.panTo(ll, { animate: true });
  }
  const nb = $("navb");
  nb.hidden = false; $("navi").textContent = n.instruction || card.title || ""; $("navd").textContent = n.detail || "";
  const stc = $("ostatus");
  stc.className = "status " + (n.wrongWay ? "stale" : "ok");
  $("owhere").textContent = `To ${st.outdoor.to ? st.outdoor.to.name : st.destination}`;
  $("ometa").textContent = [st.outdoor.remaining != null ? `${Math.round(st.outdoor.remaining)} m left` : null, st.fix ? `GPS ±${Math.round(st.fix.acc)} m` : "waiting for phone GPS", n.wrongWay ? "facing the wrong way" : null].filter(Boolean).join(" · ");
  dial(face, n.facing ? `from ${n.facing.src}` : "", Number.isFinite(n.aheadBearingTrue) ? n.aheadBearingTrue : n.routeBearing);
  $("chips").innerHTML = "<span>outdoors: camera not used</span>";
}

async function poll() {
  try {
    const [cr, sr] = await Promise.all([fetch("/api/state", { cache: "no-store" }), fetch("/api/naviq/state", { cache: "no-store" })]);
    if (!cr.ok || !sr.ok) throw new Error("server " + (cr.ok ? sr.status : cr.status));
    const card = await cr.json(), st = await sr.json();
    const outdoorTrip = st.active && st.outdoor;
    // The page follows the trip: outdoor trip → Outside box, indoor trip → Inside box (unless you just switched).
    if (st.active && Date.now() - manualTab > 15000) showTab(outdoorTrip ? "out" : "in");
    if (!outdoorTrip) { $("owhere").textContent = "No outdoor trip"; $("ometa").textContent = lastGps ? `GPS ±${Math.round(lastGps.acc)} m · search an address above` : "Search an address above."; $("ostatus").className = "status"; }
    if (!st.active) $("navb").hidden = true;
    if (outdoorTrip) renderOutdoor(card, st);
    else {
      const r = await fetch("/api/indoor/plan", { cache: "no-store" });
      if (!r.ok) throw new Error("server " + r.status);
      const p = await r.json();
      render(p);
      const n = card.nav || {};
      const src = p.heading ? "from " + (p.heading.src || (p.heading.calibrated ? "glasses compass, calibrated" : "glasses compass, not calibrated yet")) : "";
      dial(p.heading ? p.heading.deg : null, src, p.trip && p.trip.kind !== "track" && Number.isFinite(n.aheadBearingTrue) ? n.aheadBearingTrue : null);
    }
    $("err").textContent = "";
  } catch (e) { $("err").textContent = "Can't reach NAVIQ: " + e.message; }
  setTimeout(poll, 800);
}
$("frame").onerror = () => { $("frame").style.visibility = "hidden"; };
$("frame").onload = () => { $("frame").style.visibility = "visible"; };
setInterval(() => { $("frame").src = "/api/live/frame?ts=" + Date.now(); }, 1500);

const post = (url, body) => fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body || {}) }).then((r) => r.json());
const go = (room) => post("/api/naviq/start", { room }).then((r) => { $("err").textContent = r && r.error ? r.error : ""; }).catch((e) => ($("err").textContent = e.message));
const goTo = (d) => (ensureSensors(), manualTab = 0, post("/api/naviq/start", { destination: { name: d.name, lat: d.lat, lon: d.lon } }).then((r) => { $("err").textContent = r && r.error ? r.error : ""; $("results").innerHTML = ""; }).catch((e) => ($("err").textContent = e.message)));
// Rooms and places inside City Tech start an indoor trip; anything else is an address or place outside.
let indoorNames = [];
const isIndoor = (q) => /^\s*[a-z]{1,2}\s*-?\s*\d{3,4}(\.\d+)?\s*$/i.test(q) || /^(where( am i)?|track|exit|way out|bath ?rooms?|rest ?rooms?|toilets?|men'?s|women'?s|elevators?|lifts?|escalators?|stairs?|theat(er|re)|gym)$/i.test(q.trim()) || indoorNames.includes(q.trim().toLowerCase());
async function search(q) {
  if (isIndoor(q)) { $("results").innerHTML = ""; return go(q); }
  $("results").innerHTML = "<span class='sub'>Searching…</span>";
  try {
    const fix = lastGps ? `&lat=${lastGps.lat}&lon=${lastGps.lon}` : "";
    const r = await (await fetch(`/api/geo/search?q=${encodeURIComponent(q)}${fix}`)).json();
    const box = $("results"); box.innerHTML = "";
    for (const d of (r.results || []).slice(0, 5)) {
      const b = document.createElement("button"); b.type = "button";
      b.innerHTML = `${d.name.replace(/</g, "&lt;")}<small>${(d.address || "").replace(/</g, "&lt;")}</small>`;
      b.onclick = () => goTo(d); box.appendChild(b);
    }
    if (!box.children.length) box.innerHTML = "<span class='sub'>No places found</span>";
  } catch (e) { $("results").innerHTML = ""; $("err").textContent = "Search: " + e.message; }
}
$("go").onsubmit = (e) => { e.preventDefault(); ensureSensors(); const q = $("q").value.trim(); if (q) { search(q); $("q").blur(); } };

for (const q of ["Where am I", "A103", "A105", "A104", "A106", "Bathroom", "Elevator", "Exit"]) {
  const b = document.createElement("button"); b.type = "button"; b.textContent = q;
  b.onclick = () => { ensureSensors(); manualTab = 0; go(q === "Where am I" ? "where" : q); }; $("quick").appendChild(b);
}
fetch("/api/indoor/places").then((r) => r.json()).then((d) => {
  for (const p of d.places || []) { const o = document.createElement("option"); o.value = p.label; $("dests").appendChild(o); indoorNames.push(p.label.toLowerCase()); }
}).catch(() => {});
// Destination in the link: …/where?t=TOKEN&to=Jay%20St%20MetroTech
const toParam = new URLSearchParams(location.search).get("to");
if (toParam) { $("q").value = toParam; setTimeout(() => { if (!isIndoor(toParam)) showTab("out", true); search(toParam); }, 300); }
$("stop").onclick = () => post("/api/naviq/stop").catch(() => {});
$("reset").onclick = () => post("/api/heading", { reset: true }).catch(() => {});

// ---------- phone compass → server (iPhone: webkitCompassHeading is magnetic; NYC declination ≈ 12.8° W) ----------
const DECLINATION = -12.8;
let pLast = null, pSentAt = 0, pOn = false;
function onOrient(e) {
  let mag = null;
  if (typeof e.webkitCompassHeading === "number" && e.webkitCompassHeading >= 0) mag = e.webkitCompassHeading;
  else if (e.absolute && typeof e.alpha === "number") mag = (360 - e.alpha) % 360; // Android absolute
  if (mag == null) return;
  const h = (mag + DECLINATION + 360) % 360, now = Date.now();
  const moved = pLast == null || Math.abs(((h - pLast + 540) % 360) - 180) > 2;
  if ((moved && now - pSentAt > 300) || now - pSentAt > 1500) {
    pLast = h; pSentAt = now;
    post("/api/heading/phone", { h }).catch(() => {});
    $("sens").textContent = `Compass ${Math.round(h)}° · ${totalSteps} steps${lastGps ? ` · GPS ±${Math.round(lastGps.acc)} m` : ""}`;
  }
}
// Steps: peaks in the phone's acceleration (walking bounce), at most one every 300 ms.
let avg = 9.8, above = false, lastStep = 0, pendingSteps = 0, totalSteps = 0;
function onMotion(e) {
  const a = e.accelerationIncludingGravity; if (!a || a.x == null) return;
  const mag = Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z), now = Date.now();
  avg = avg * 0.95 + mag * 0.05;
  if (!above && mag > avg + 1.4 && now - lastStep > 300) { above = true; lastStep = now; pendingSteps++; totalSteps++; }
  else if (above && mag < avg + 0.4) above = false;
}
setInterval(() => { if (pendingSteps) { const n = pendingSteps; pendingSteps = 0; post("/api/steps", { n }).catch(() => {}); } }, 1000);
// GPS for outdoor trips started from this page (same format as the main phone page).
let gpsWatch = null;
function startGps() {
  if (gpsWatch != null || !navigator.geolocation) return;
  gpsWatch = navigator.geolocation.watchPosition((p) => {
    const c = p.coords; lastGps = { lat: c.latitude, lon: c.longitude, acc: c.accuracy };
    post("/api/naviq/loc", { lat: c.latitude, lon: c.longitude, acc: c.accuracy, speed: c.speed == null ? undefined : c.speed, sampleAt: p.timestamp }).catch(() => {});
  }, (e) => { $("err").textContent = "GPS: " + e.message; }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
}
let sensorsAsked = false;
async function ensureSensors() {
  if (sensorsAsked) return; sensorsAsked = true;
  try {
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      const r = await DeviceOrientationEvent.requestPermission();
      if (r !== "granted") { $("err").textContent = "Permission denied: allow Motion & Orientation for this site."; return; }
    }
    if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") await DeviceMotionEvent.requestPermission().catch(() => {});
    if (!pOn) {
      window.addEventListener("deviceorientationabsolute", onOrient); window.addEventListener("deviceorientation", onOrient);
      window.addEventListener("devicemotion", onMotion); pOn = true;
    }
    startGps();
    $("sens").textContent = "Compass · steps · GPS on";
  } catch (e) { $("err").textContent = "Sensors: " + e.message; }
}
// Tabs
function showTab(which, manual) {
  const out = which === "out";
  $("boxIn").hidden = out; $("boxOut").hidden = !out;
  $("tabIn").className = "tab" + (out ? "" : " on"); $("tabOut").className = "tab" + (out ? " on" : "");
  if (manual) manualTab = Date.now();
  if (out && omap) setTimeout(() => omap.invalidateSize(), 0);
  if (out && !omap) initOmap();
}
$("tabIn").onclick = () => { ensureSensors(); showTab("in", true); };
$("tabOut").onclick = () => { ensureSensors(); showTab("out", true); };
startGps(); // GPS doesn't need a tap; compass/steps do (iPhone asks on the first button you press)
poll();
</script>
</body>
</html>
